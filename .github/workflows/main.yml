name: Ennahar News Updates

on:
  schedule:
    - cron: "*/5 * * * *"   # checks every 5 minutes
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ennahar-news-updater
  cancel-in-progress: false

jobs:
  post-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - run: python fetch_and_post.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Save seen articles
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update seen articles"
          file_pattern: seen_articles.jsonticles.json
